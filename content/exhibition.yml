# The Darker Side of Pink — the exhibition's own words and its tour history.
#
# This page was missing from the WordPress export, so the build had been
# generating a paraphrase of it. This file is the charity's actual copy, taken
# from the live page, so the page says what they wrote rather than what the
# build guessed. Editable here without touching a template.
#
# Two obvious spelling slips in the source are corrected: "awarentess" and
# "Cental Library". Nothing else is reworded.

intro:
  eyebrow: "Fact"
  heading: "Every day, 31 women lose their lives to metastatic breast cancer."
  body:
    - "‘The Darker Side of Pink’ is a physical interactive mobile experience that helps create awareness of Metastatic Breast Cancer, the biggest cancer killer of women under the age of 50 in the UK."
    - "It features 31 transparent figures – one for each woman who dies every day from Metastatic or secondary breast cancer – each with an individual QR code that plays a video from breast cancer patients who have lived and living with this death sentence."

sections:
  - eyebrow: "Our mission"
    heading: "Campaigning for awareness, and to push policy to change for the better."
    body:
      - "METUPUK is the ONLY patient advocacy group in the UK. It is a self funded charity focusing on Metastatic Breast Cancer. MBC is the somewhat invisible side of cancer, especially as it is the biggest killer of women under the age of fifty here in the UK."
      - "The volunteer-led organisation works to promote the issues affecting those with secondary and/or metastatic breast cancer, with a particular focus on working to improve outcomes for those living with MBC and tackling the backlog of care for patients."
      - "We ultimately work towards the day when MBC will be cured."
    link:
      text: "Find out more"
      url: "/about-us/"

  - eyebrow: "Raise awareness of MBC"
    heading: "Campaigning for awareness, equal priority for funding, research and innovation."
    body:
      - "Give metastatic (secondary) breast cancer patients a chance to live and don’t write us off. We can be #BusyLivingWithMets, even those on The Darker Side of Pink."
      - "Tag METUPUK into your tweet, Instagram, Facebook share."
    link:
      text: "Find out how you can help"
      url: "/help-us/"

tour:
  eyebrow: "Spreading awareness throughout the UK"
  heading: "To help push policy to change for the better."
  body:
    - "Our figures will be displayed in various locations around the UK from galleries, to public libraries and shopping centres to help promote the issues affecting those with secondary and/or metastatic breast cancer."
  enquiry: "If you would like to discuss the opportunity to display our campaign figures in your venue, please do get in touch."
  enquiryLink:
    text: "Get in touch"
    url: "/help-us/"

