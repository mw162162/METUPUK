<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Edit this site</title>
<style>
  .boot {
    font: 500 15px/1.5 system-ui, sans-serif;
    padding: 2rem; max-width: 34rem; margin: 0 auto; color: #2b0519;
  }
  .boot p { margin: 0 0 .75rem; }
  .boot code { background: #f4eef0; padding: .1em .35em; border-radius: 3px; }
</style>
<!--
  Sveltia CMS. Reads /admin/config.yml, writes content files back to the repo.

  Pinned to a major version rather than @latest: an editor that silently
  changes under a client is worse than one that is a version behind.
-->
<script src="https://unpkg.com/@sveltia/cms@0/dist/sveltia-cms.js" type="module"></script>
</head>
<body>
<script>
/*
  Show the real page.

  The first version of this rendered the content blocks with the site's
  stylesheet, which looked closer but was still not the page: no header, no
  banner, none of the layout passes the build runs. A preview that is nearly
  the page is a preview a client cannot trust.

  So this frames the built page itself. What you see is what is published,
  because it *is* what is published — same HTML, same CSS, same everything.
  The cost is that it shows the last build rather than unsaved keystrokes;
  `npm run dev` watches content/ and rebuilds on save, which closes that gap to
  about as long as it takes to look up.
*/
(function () {
  // Whose site this is. Set per client, alongside logo_url in the config.
  var BRAND = 'METUPUK';

  function ready(fn) {
    if (window.CMS && window.h) return fn();
    setTimeout(function () { ready(fn); }, 120);
  }

  // The browser tab said "Sveltia CMS". A client has a dozen tabs open and
  // none of them are called that, so theirs is the one they cannot find —
  // and the name of the tool they were handed is not information they need.
  // Only the product name is replaced, so the page name Sveltia puts in front
  // of it survives.
  (function renameTab() {
    var fix = function () {
      if (document.title.indexOf('Sveltia CMS') === -1) return;
      document.title = document.title.replace('Sveltia CMS', 'Edit ' + BRAND);
    };
    fix();
    var head = document.querySelector('head');
    if (head && window.MutationObserver) {
      new MutationObserver(fix).observe(head, { subtree: true, childList: true, characterData: true });
    } else {
      setInterval(fix, 1000);
    }
  }());

  function field(entry, name) {
    try {
      if (entry && typeof entry.getIn === 'function') {
        var v = entry.getIn(['data', name]);
        return v && typeof v.toJS === 'function' ? v.toJS() : v;
      }
      return ((entry && (entry.data || entry)) || {})[name];
    } catch (e) { return undefined; }
  }

  // Reload the frame when the site rebuilds. `npm run dev` re-renders the edited
  // page in about forty milliseconds and stamps build-id.txt; polling that one
  // small file is enough to know. No websocket, no dev-server plugin, and
  // nothing that has to exist in production — in a deployed build the token
  // simply never changes and this loop costs one request every two seconds.
  function watchForRebuilds(frame, onReload) {
    if (!frame || frame.dataset.watching) return;
    frame.dataset.watching = '1';
    var last = null;
    setInterval(function () {
      fetch('/build-id.txt', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.text() : null; })
        .then(function (id) {
          if (!id) return;
          if (last !== null && id !== last) {
            // Keep the reader where they were. Editing section twelve and
            // being thrown back to the top of the page on every save is the
            // kind of small thing that makes an editor tiring to use, and the
            // frame is same-origin so the position is there for the asking.
            var keep = 0;
            try { keep = frame.contentWindow.scrollY || 0; } catch (e) {}
            frame.addEventListener('load', function restore() {
              frame.removeEventListener('load', restore);
              try {
                // Instant, not smooth. The site sets scroll-behavior: smooth,
                // so the default would animate a scroll from the top on every
                // single save — putting motion where the reader expects to
                // have simply stayed put.
                if (keep) frame.contentWindow.scrollTo({ top: keep, behavior: 'instant' });
              } catch (e) {}
            });
            frame.setAttribute('src', frame.getAttribute('src').split('?')[0] + '?preview=' + id);
            if (onReload) onReload();
          }
          last = id;
        })
        .catch(function () { /* server not running; nothing to refresh */ });
    }, 2000);
  }

  ready(function () {
    // Every device is a real width, desktop included. It used to be 0, meaning
    // "however wide the pane happens to be" — which is a column about 1100px
    // across in a split view, so the desktop button never showed the desktop
    // layout. It showed a narrow one and called it desktop.
    // Height as well as width, because this site is full of things measured
    // against the viewport: a 100svh hero, a pinned scrollytelling section,
    // scroll-driven reveals. Give the frame the pane's height instead of the
    // device's and every one of them previews at proportions no real screen
    // has — the hero comes out twice as tall as it will ever be, which is the
    // opposite of what a device preview is for.
    var DEVICES = [
      { id: 'mobile', label: 'Phone', w: 390, h: 844 },
      { id: 'tablet', label: 'Tablet', w: 834, h: 1112 },
      { id: 'desktop', label: 'Desktop', w: 1280, h: 800 },
    ];

    function shell(node) {
      if (!node || node.dataset.wired) return;
      node.dataset.wired = '1';
      var frame = node.querySelector('iframe');
      var stage = node.querySelector('[data-stage]');
      var readout = node.querySelector('[data-readout]');
      var status = node.querySelector('[data-status]');
      var current = DEVICES[2];

      // The preview shows the last build, not the keystroke just typed, and
      // nothing on screen used to say so — which reads as a broken preview
      // rather than as one waiting for a save. Saying "Updated" the moment the
      // rebuild lands is the confirmation that was missing.
      var clearStatus = null;
      function flash(text) {
        status.textContent = text;
        status.style.opacity = '1';
        if (clearStatus) clearTimeout(clearStatus);
        clearStatus = setTimeout(function () { status.style.opacity = '0'; }, 2600);
      }

      watchForRebuilds(frame, function () { flash('Updated'); });

      // The pane has to be measured rather than inherited. height:100% only
      // resolves when every ancestor has a height of its own, and inside
      // somebody else's application that is not a safe assumption — when it
      // fails the box collapses to a couple of hundred pixels and the preview
      // looks cropped, which is exactly what it did.
      function stretch() {
        var top = node.getBoundingClientRect().top;
        var available = window.innerHeight - top - 4;
        node.style.height = (available > 240 ? available : 480) + 'px';
      }

      // Show the whole device, not the top-left corner of it. The page is laid
      // out at the device's true width and then scaled down to fit, so a
      // desktop layout can be judged in a pane narrower than a desktop —
      // which is the only way it is ever going to be looked at in here.
      function fit() {
        var roomW = stage.clientWidth;
        var roomH = stage.clientHeight;
        if (!roomW || !roomH) return;
        // The whole screen, scaled to fit both ways — a shrunken browser
        // window rather than a tall crop of one. The page scrolls inside it
        // the way it scrolls on the device.
        var scale = Math.min(1, roomW / current.w, roomH / current.h);
        frame.style.width = current.w + 'px';
        frame.style.height = current.h + 'px';
        frame.style.transform = scale < 1 ? 'scale(' + scale + ')' : 'none';
        frame.style.transformOrigin = 'top left';
        frame.style.left = Math.max(0, (roomW - current.w * scale) / 2) + 'px';
        frame.style.top = Math.max(0, (roomH - current.h * scale) / 2) + 'px';
        readout.textContent = current.w + ' × ' + current.h
          + (scale < 1 ? ' · ' + Math.round(scale * 100) + '%' : '');
      }

      function apply(id) {
        current = DEVICES.filter(function (x) { return x.id === id; })[0] || DEVICES[2];
        Array.prototype.forEach.call(node.querySelectorAll('[data-device]'), function (b) {
          var on = b.getAttribute('data-device') === id;
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
          b.style.background = on ? '#2b0519' : 'transparent';
          b.style.color = on ? '#fff' : '#2b0519';
        });
        stretch();
        fit();
        try { localStorage.setItem('metupuk-preview-device', id); } catch (e) {}
      }

      Array.prototype.forEach.call(node.querySelectorAll('[data-device]'), function (b) {
        b.addEventListener('click', function () { apply(b.getAttribute('data-device')); });
      });

      // Dragging the divider between the fields and the preview resizes the
      // pane without resizing the window, so the window event is not enough.
      window.addEventListener('resize', function () { stretch(); fit(); });
      if (window.ResizeObserver) {
        new ResizeObserver(function () { stretch(); fit(); }).observe(stage);
      }

      var saved = null;
      try { saved = localStorage.getItem('metupuk-preview-device'); } catch (e) {}
      apply(saved || 'desktop');
    }

    var view = function (props) {
      var url = field(props && props.entry, 'url');
      if (typeof url !== 'string' || url.charAt(0) !== '/') {
        return window.h('p', { style: { padding: '1.5rem', font: '15px system-ui' } },
          'Give this page a URL to see it previewed.');
      }
      var src = url + (url.indexOf('?') === -1 ? '?' : '&') + 'preview=' + Date.now();

      var btnStyle = {
        font: '600 12px/1 system-ui', letterSpacing: '.04em', textTransform: 'uppercase',
        padding: '7px 11px', border: '1px solid rgba(43,5,25,.25)', borderRadius: '999px',
        cursor: 'pointer', background: 'transparent', color: '#2b0519',
      };
      var buttons = DEVICES.map(function (d) {
        return window.h('button', {
          key: d.id, type: 'button', 'data-device': d.id,
          'aria-pressed': 'false', title: d.label + (d.w ? ' (' + d.w + 'px)' : ''),
          style: btnStyle,
        }, d.label);
      });

      return window.h('div', {
        ref: shell,
        style: { display: 'flex', flexDirection: 'column', height: '100%', background: '#f4eef0' },
      }, [
        window.h('div', {
          key: 'bar',
          style: {
            display: 'flex', alignItems: 'center', gap: '6px',
            padding: '8px 12px', borderBottom: '1px solid rgba(43,5,25,.14)',
            background: '#fff', flex: '0 0 auto',
          },
        }, buttons.concat([
          window.h('span', {
            key: 'status', 'data-status': '1',
            style: {
              marginLeft: 'auto', font: '600 12px/1 system-ui', color: '#1c7c4a',
              opacity: '0', transition: 'opacity 200ms ease',
            },
          }, ''),
          window.h('span', {
            key: 'readout', 'data-readout': '1',
            style: { font: '500 12px/1 system-ui', color: '#6b5560' },
          }, ''),
          // Sometimes you just want the page itself — to click through it, to
          // check a link, to show somebody. The preview is a frame; this is
          // the door out of it.
          window.h('a', {
            key: 'open', href: url, target: '_blank', rel: 'noopener',
            title: 'Open this page in a new tab',
            style: {
              font: '600 12px/1 system-ui', color: '#2b0519', textDecoration: 'none',
              border: '1px solid rgba(43,5,25,.25)', borderRadius: '999px',
              padding: '7px 11px', letterSpacing: '.04em', textTransform: 'uppercase',
            },
          }, 'Open'),
        ])),
        // The stage clips. A scaled element still takes its full untransformed
        // size in the layout, so a 1280px frame would push a scrollbar across
        // the pane however far down it had been shrunk.
        window.h('div', {
          key: 'stage', 'data-stage': '1',
          style: {
            flex: '1 1 auto', minHeight: '0', overflow: 'hidden',
            position: 'relative', background: '#fff',
          },
        }, window.h('iframe', {
          key: 'frame', src: src, title: 'Live preview',
          // Out of flow on purpose. An in-flow 1280px frame contributes that
          // width to everything above it, and a flex item's min-width is auto
          // by default — so the preview pane refused to shrink and squeezed the
          // fields column down to 71px instead of scaling itself. Positioned
          // absolutely it contributes nothing, and the pane sizes freely.
          style: { position: 'absolute', top: '0', left: '0', border: '0', display: 'block', background: '#fff' },
        })),
      ]);
    };

    ['pages', 'posts'].forEach(function (name) {
      try { window.CMS.registerPreviewTemplate(name, view); } catch (e) { /* keep the default */ }
    });
  });
}());
</script>
<script>
/*
  Sign the editor in without the client ever seeing GitHub.

  Sveltia has a hand-off route for exactly this — `#/signin/<base64 JSON>`
  carrying a token — so this asks the Worker for one and uses that route. The
  Worker only answers a request that Cloudflare Access has already checked an
  email address against, which is what turns "log in to GitHub" into "enter
  your email and the code we sent you".

  Everything here fails open to the normal sign-in screen. Locally there is no
  Worker and no Access, the fetch 404s, and the editor offers "Work with Local
  Repository" as usual — which is what you want while developing.
*/
(function () {
  var ONCE = 'cms-token-attempted';
  if (sessionStorage.getItem(ONCE)) return;
  sessionStorage.setItem(ONCE, '1');

  // Already signed in from a previous visit: leave it alone.
  if (location.hash.indexOf('/signin/') !== -1) return;

  fetch('/cms-token', { credentials: 'include' })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (data) {
      if (!data || typeof data.token !== 'string') return;
      // btoa cannot handle characters above U+00FF; a GitHub token is ASCII,
      // but encode defensively so a future field cannot break sign-in.
      var payload = JSON.stringify({ token: data.token });
      var encoded = btoa(String.fromCharCode.apply(null, new TextEncoder().encode(payload)));
      location.hash = '/signin/' + encoded;
    })
    .catch(function () {
      /* No Worker reachable. The normal sign-in screen is the fallback. */
    });
}());
</script>
<noscript>
  <div class="boot">
    <p><strong>This editor needs JavaScript.</strong></p>
    <p>The site itself does not — every page reads perfectly without it. It is only the editing screen that does.</p>
  </div>
</noscript>
</body>
</html>
