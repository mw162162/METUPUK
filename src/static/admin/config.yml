# Generated by build/make-admin-config.js — do not edit.
#
# Site settings live in src/admin/config.base.yml.
# Components live in build/lib/components.js, which is also where the build
# gets its renderers, so the editor cannot offer a component the site cannot
# render.
# Editor configuration — the per-site half.
#
# Read by Sveltia CMS (and by Decap, which shares this format) from /admin.
# Content lives as files in the repo, so an edit is a commit and a commit
# rebuilds the site. There is no database and no per-seat licence.
#
# This file holds what changes per client: which repo, which collections, and
# what a page's own fields are. The component list is generated into it from
# build/lib/components.js, which is also where the build gets its renderers —
# so the editor cannot offer a component the site cannot render.
#
# Do not edit src/static/admin/config.yml. It is generated from this file.

backend:
  name: github
  repo: mmjwp1/metupuk
  branch: main
  # Sveltia talks to GitHub directly; no OAuth server of your own is needed.

# No local_backend here: Sveltia ignores that option and warns about it on
# every load. Editing local files is its own "Work with Local Repository"
# button, which asks for the project folder and needs no server.

# The originals only, not the WordPress renditions. Pointing this at
# _scrape/assets meant the editor walked 5,436 files and 1.1 GB before it could
# show anything, and then offered a client eight crops of every photograph.
# Rebuild it with: npm run media
media_folder: "media-library"
public_folder: "/media"

# Editors see the site, not the repo.
site_url: /
display_url: /

# The sign-in screen is the first thing a client ever sees of this, and out of
# the box it is somebody else's orange logo above two buttons about GitHub.
# One line puts their own mark there instead.
logo_url: /brand/metupuk-logo-180.png

definitions:
  prose: &prose
    label: "Text"
    name: prose
    summary: "Text · {{fields.body | truncate(64)}}"
    fields:
      - label: "Body"
        name: "body"
        widget: "markdown"
        modes: ["raw"]

  image: &image
    label: "Image"
    name: image
    summary: "Image · {{fields.alt | default('no description yet')}}"
    fields:
      - label: "Picture"
        name: "src"
        widget: "image"
      - label: "Describe this picture"
        name: "alt"
        widget: "string"
        required: false
        hint: "What would you say to someone on the phone who cannot see it? A person’s name, what is happening, what the graphic says."
      - label: "This picture is decorative"
        name: "decorative"
        widget: "boolean"
        default: false
        hint: "Tick only if the picture adds nothing a reader would miss. It will be hidden from screen readers. Leave unticked and write a description for every photograph of a person."
      - label: "Caption"
        name: "caption"
        widget: "string"
        required: false
      - label: "Width"
        name: "width"
        widget: "number"
        required: false
      - label: "Height"
        name: "height"
        widget: "number"
        required: false

  buttons: &buttons
    label: "Buttons"
    name: buttons
    summary: "Buttons"
    fields:
      - label: "Buttons"
        name: "buttons"
        widget: "list"
        label_singular: "Button"
        summary: "{{fields.label}}"
        fields:
          - label: "Text on the button"
            name: "label"
            widget: "string"
          - label: "Link"
            name: "href"
            widget: "string"
            hint: "A page on this site like /help-us/, or a full address like https://example.org"
          - label: "Style"
            name: "style"
            widget: "select"
            default: "primary"
            options: ["primary", "pink", "ghost"]
          - label: "Open in a new tab"
            name: "newTab"
            widget: "boolean"
            default: false
            hint: "Leave off for pages on this site. Turn on for somewhere else entirely."

  columns: &columns
    label: "Columns"
    name: columns
    summary: "Columns"
    fields:
      - label: "Width"
        name: "layout"
        widget: "select"
        default: "equal"
        options: ["equal", "wide-left", "wide-right"]
        hint: "Columns stack into one on a phone whichever you choose."
      - label: "Columns"
        name: "columns"
        widget: "list"
        label_singular: "Column"
        fields:
          - label: "Body"
            name: "body"
            widget: "markdown"
            modes: ["raw"]

  quote: &quote
    label: "Pull quote"
    name: quote
    summary: "Quote · {{fields.text | truncate(64)}}"
    fields:
      - label: "Quote"
        name: "text"
        widget: "text"
      - label: "Attribution"
        name: "attribution"
        widget: "string"
        required: false

  disclosure: &disclosure
    label: "Expandable section"
    name: disclosure
    summary: "Expandable · {{fields.summary | truncate(28)}} — {{fields.body | truncate(38)}}"
    fields:
      - label: "Heading"
        name: "summary"
        widget: "string"
      - label: "Body"
        name: "body"
        widget: "markdown"
        modes: ["raw"]

  card: &card
    label: "Card"
    name: card
    summary: "Card · {{fields.heading | default('untitled')}}"
    fields:
      - label: "Heading"
        name: "heading"
        widget: "string"
      - label: "Image"
        name: "image"
        widget: "image"
        required: false
      - label: "Alt text"
        name: "imageAlt"
        widget: "string"
        required: false
      - label: "Link"
        name: "href"
        widget: "string"
        required: false
      - label: "Body"
        name: "body"
        widget: "markdown"
        modes: ["raw"]
        required: false

  gallery: &gallery
    label: "Picture grid"
    name: gallery
    summary: "Picture grid"
    fields:
      - label: "Pictures"
        name: "images"
        widget: "list"
        label_singular: "Picture"
        fields:
          - label: "Picture"
            name: "src"
            widget: "image"
          - label: "Describe this picture"
            name: "alt"
            widget: "string"
            required: false

  video: &video
    label: "Video file"
    name: video
    summary: "Video · {{fields.caption | default('no caption')}}"
    fields:
      - label: "Video file"
        name: "src"
        widget: "file"
        hint: "An MP4 you upload. For YouTube or Vimeo, use \"Embedded video\" instead."
      - label: "Captions file"
        name: "captions"
        widget: "file"
        required: false
        hint: "A .vtt subtitle file. Without one this video is unusable for anyone deaf — please add it."
      - label: "Still image"
        name: "poster"
        widget: "image"
        required: false
        hint: "Shown before anyone presses play."
      - label: "Caption"
        name: "caption"
        widget: "string"
        required: false

  embed: &embed
    label: "Embedded video or player"
    name: embed
    summary: "Embed · {{fields.title | truncate(22)}} — {{fields.src | truncate(38)}}"
    fields:
      - label: "Address"
        name: "src"
        widget: "string"
        hint: "The embed address, e.g. https://www.youtube.com/embed/XXXX"
      - label: "Title"
        name: "title"
        widget: "string"
        required: false
        hint: "What the video is, for anyone who cannot see it."
      - label: "Kind"
        name: "variant"
        widget: "select"
        default: "video"
        options: ["video", "audio", "panel"]

  profiles: &profiles
    label: "People"
    name: profiles
    summary: "People"
    fields:
      - label: "People"
        name: "people"
        widget: "list"
        label_singular: "Person"
        summary: "{{fields.name}}"
        fields:
          - label: "Name"
            name: "name"
            widget: "string"
          - label: "Role"
            name: "role"
            widget: "string"
            required: false
          - label: "About"
            name: "body"
            widget: "markdown"
            modes: ["raw"]
            required: false
          - label: "Links"
            name: "links"
            widget: "list"
            required: false
            field:
              label: "Address"
              name: "href"
              widget: "string"

  form: &form
    label: "Form"
    name: form
    summary: "Form · {{fields.name | default('untitled')}}"
    fields:
      - label: "Form name"
        name: "name"
        widget: "string"
        hint: "Shown with each message so you know which form it came from."
      - label: "Intro"
        name: "intro"
        widget: "text"
        required: false
      - label: "Questions"
        name: "fields"
        widget: "list"
        label_singular: "Question"
        summary: "{{fields.label}}"
        fields:
          - label: "Label"
            name: "label"
            widget: "string"
          - label: "Field name"
            name: "name"
            widget: "string"
            hint: "Lowercase, no spaces. This is the heading it arrives under."
          - label: "Type"
            name: "type"
            widget: "select"
            default: "text"
            options: ["text", "email", "tel", "textarea"]
          - label: "Required"
            name: "required"
            widget: "boolean"
            default: false
          - label: "Help text"
            name: "help"
            widget: "string"
            required: false
      - label: "Consent line"
        name: "consent"
        widget: "string"
        required: false
        hint: "A tick box people must agree to before sending. Leave empty for none."
      - label: "Thank-you message"
        name: "success"
        widget: "string"
        required: false
        hint: "Shown in place of the form once it has sent."
      - label: "Button text"
        name: "submit"
        widget: "string"
        default: "Send"
      - label: "Send submissions to"
        name: "action"
        widget: "string"
        required: false
        default: "netlify"
        hint: "Leave as netlify unless you have your own endpoint."

  html: &html
    label: "Custom HTML"
    name: html
    summary: "Custom HTML"
    fields:
      - label: "HTML"
        name: "html"
        widget: "code"
        default_language: "html"
        output_code_only: true
        hint: "An escape hatch. Anything here is published exactly as written."

collections:
  - name: pages
    label: "Pages"
    label_singular: "Page"
    folder: content/pages
    create: true
    # {{slug}} is the built-in one, made from the identifier field below.
    # It used to be {{fields.slug}}, which named a field no page has and none
    # declares — so every page created in the editor was written to a file with
    # no name in it.
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [title, date]
    view_groups:
      - { label: "Section of the site", field: parent }
    fields:
      # Content first. These used to sit below six fields of plumbing — the
      # address, two timestamps, the parent slug and a sort order — so the one
      # thing somebody opened the page to change was the tenth thing they saw.
      - { label: "Title", name: title, widget: string }
      - { label: "Summary", name: excerpt, widget: text, required: false,
          hint: "Shown under the heading and in search results. Leave empty to use the opening of the page." }
      - { label: "Banner image", name: image, widget: image, required: false }
      - { label: "Banner alt text", name: imageAlt, widget: string, required: false,
          hint: "What the picture shows, for anyone who cannot see it." }
      - label: "Sections"
        name: sections
        widget: list
        required: false
        label_singular: "Section"
        types:
          - *prose
          - *image
          - *buttons
          - *columns
          - *quote
          - *disclosure
          - *card
          - *gallery
          - *video
          - *embed
          - *profiles
          - *form
          - *html

      # Everything below here is how the page is filed rather than what it
      # says. It is last on purpose: it is rarely the reason anyone opened
      # the page, and changing the address breaks every link to it.
      - { label: "Web address", name: url, widget: string, required: false,
          hint: "Leave empty and we will build one from the title. Fill it in only to move a page — changing it breaks every existing link and any search result pointing at it." }
      - { label: "Sits under", name: parent, widget: string, required: false,
          hint: "The last part of the address of the page above this one in the menu. Leave empty for a top-level page." }
      - { label: "Order in the menu", name: order, widget: number, required: false,
          hint: "Lower numbers come first. Leave empty to sort by title." }
      - { label: "First published", name: date, widget: datetime, required: false }
      - { label: "Last updated", name: modified, widget: datetime, required: false }

  - name: posts
    label: "News and blog"
    label_singular: "Post"
    folder: content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [date, title]
    # 228 posts in one flat list is a scroll, not a way of finding anything.
    view_groups:
      - { label: "Year", field: date, pattern: "\\d{4}" }
    fields:
      - { label: "Title", name: title, widget: string }
      - label: "Topics"
        name: categories
        widget: select
        multiple: true
        required: false
        hint: "Which topic pages this post appears on. Pick as many as fit."
        options:
            - { label: "Alternative Therapies", value: "alternative-therapies" }
            - { label: "Clinical Trial", value: "clinical-trial" }
            - { label: "Conferences", value: "conferences" }
            - { label: "Data", value: "data" }
            - { label: "Diagnosis", value: "diagnosis" }
            - { label: "Drug Approval", value: "drug-approval" }
            - { label: "Education", value: "education" }
            - { label: "Fundraising", value: "fundraising" }
            - { label: "Help Us", value: "help-us" }
            - { label: "Living with MBC", value: "living-with-mbc" }
            - { label: "Member Stories", value: "member-stories" }
            - { label: "News", value: "news" }
            - { label: "Organisations", value: "organisations" }
            - { label: "Patient Advocacy", value: "patient-advocacy" }
            - { label: "Policy", value: "policy" }
            - { label: "Press", value: "press" }
            - { label: "Quality of Life", value: "quality-of-life" }
            - { label: "Research", value: "research" }
            - { label: "Reviews", value: "reviews" }
            - { label: "Social Media Campaign", value: "social-media-campaign" }
            - { label: "Treatment Options", value: "treatment-options" }
      - { label: "Summary", name: excerpt, widget: text, required: false,
          hint: "Shown under the heading and in search results. Leave empty to use the opening of the post." }
      - { label: "Featured image", name: image, widget: image, required: false }
      - { label: "Featured image alt text", name: imageAlt, widget: string, required: false,
          hint: "What the picture shows, for anyone who cannot see it." }
      - label: "Sections"
        name: sections
        widget: list
        required: false
        label_singular: "Section"
        types:
          - *prose
          - *image
          - *buttons
          - *columns
          - *quote
          - *disclosure
          - *card
          - *gallery
          - *video
          - *embed
          - *profiles
          - *form
          - *html

      - { label: "Web address", name: url, widget: string, required: false,
          hint: "Leave empty and we will build one from the date and the title. Changing it breaks every existing link to this post." }
      - { label: "Published", name: date, widget: datetime }
      - { label: "Last updated", name: modified, widget: datetime, required: false }
