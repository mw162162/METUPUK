# Generated by build/make-admin-config.js — do not edit.
#
# Site settings live in src/admin/config.base.yml.
# Components live in build/lib/components.js, which is also where the build
# gets its renderers, so the editor cannot offer a component the site cannot
# render.
# Editor configuration.
#
# Read by Sveltia CMS (and by Decap, which shares this format) from /admin.
# Content lives as files in the repo, so an edit is a commit and a commit
# rebuilds the site. There is no database and no per-seat licence.
#
# The component list under `sections` is the part that matters commercially:
# it is what the client sees when they press "Add section", and it is the same
# list on every site built from this kit. Add a component here and it appears
# in the editor; the build renders it.

backend:
  name: github
  repo: OWNER/REPO          # set per client
  branch: main
  # Sveltia talks to GitHub directly; no OAuth server of your own is needed.

# Lets you run the editor against local files while developing:
#   npx @sveltia/cms-proxy-server   then open /admin
local_backend: true

# The originals only, not the WordPress renditions. Pointing this at
# _scrape/assets meant the editor walked 5,436 files and 1.1 GB before it could
# show anything, and then offered a client eight crops of every photograph.
# Rebuild it with: npm run media
media_folder: "media-library"
public_folder: "/media"

# Editors see the site, not the repo.
site_url: /
display_url: /

# ---------------------------------------------------------------------------
# Reusable component definitions.
#
# YAML anchors keep one definition per component. A collection references them
# with `<<: *name`, so a component is described once and behaves identically
# wherever it is offered.
# ---------------------------------------------------------------------------
definitions:
  prose: &prose
    label: "Text"
    name: prose
    summary: "Text"
    fields:
      - label: "Body"
        name: "body"
        widget: "markdown"

  disclosure: &disclosure
    label: "Expandable section"
    name: disclosure
    summary: "Expandable: {{fields.summary}}"
    fields:
      - label: "Heading"
        name: "summary"
        widget: "string"
      - label: "Body"
        name: "body"
        widget: "markdown"

  embed: &embed
    label: "Embedded video or player"
    name: embed
    summary: "Embed: {{fields.title}}"
    fields:
      - label: "Address"
        name: "src"
        widget: "string"
        hint: "The embed address, e.g. https://www.youtube.com/embed/XXXX"
      - label: "Title"
        name: "title"
        widget: "string"
        required: false
        hint: "What the video is, for anyone who cannot see it."
      - label: "Kind"
        name: "variant"
        widget: "select"
        default: "video"
        options: ["video", "audio", "panel"]

  card: &card
    label: "Card"
    name: card
    summary: "Card: {{fields.heading}}"
    fields:
      - label: "Heading"
        name: "heading"
        widget: "string"
      - label: "Image"
        name: "image"
        widget: "image"
        required: false
      - label: "Alt text"
        name: "imageAlt"
        widget: "string"
        required: false
      - label: "Link"
        name: "href"
        widget: "string"
        required: false
      - label: "Body"
        name: "body"
        widget: "markdown"
        required: false

  gallery: &gallery
    label: "Picture grid"
    name: gallery
    summary: "Picture grid"
    fields:
      - label: "Pictures"
        name: "images"
        widget: "list"
        label_singular: "Picture"
        fields:
          - label: "Picture"
            name: "src"
            widget: "image"
          - label: "Describe this picture"
            name: "alt"
            widget: "string"
            required: false

  profiles: &profiles
    label: "People"
    name: profiles
    summary: "People"
    fields:
      - label: "People"
        name: "people"
        widget: "list"
        label_singular: "Person"
        summary: "{{fields.name}}"
        fields:
          - label: "Name"
            name: "name"
            widget: "string"
          - label: "Role"
            name: "role"
            widget: "string"
            required: false
          - label: "About"
            name: "body"
            widget: "markdown"
            required: false
          - label: "Links"
            name: "links"
            widget: "list"
            required: false
            field:
              label: "Address"
              name: "href"
              widget: "string"

  video: &video
    label: "Video file"
    name: video
    summary: "Video: {{fields.caption}}"
    fields:
      - label: "Video file"
        name: "src"
        widget: "file"
        hint: "An MP4 you upload. For YouTube or Vimeo, use \"Embedded video\" instead."
      - label: "Captions file"
        name: "captions"
        widget: "file"
        required: false
        hint: "A .vtt subtitle file. Without one this video is unusable for anyone deaf — please add it."
      - label: "Still image"
        name: "poster"
        widget: "image"
        required: false
        hint: "Shown before anyone presses play."
      - label: "Caption"
        name: "caption"
        widget: "string"
        required: false

  buttons: &buttons
    label: "Buttons"
    name: buttons
    summary: "Buttons"
    fields:
      - label: "Buttons"
        name: "buttons"
        widget: "list"
        label_singular: "Button"
        summary: "{{fields.label}}"
        fields:
          - label: "Text on the button"
            name: "label"
            widget: "string"
          - label: "Link"
            name: "href"
            widget: "string"
            hint: "A page on this site like /help-us/, or a full address like https://example.org"
          - label: "Style"
            name: "style"
            widget: "select"
            default: "primary"
            options: ["primary", "pink", "ghost"]
          - label: "Open in a new tab"
            name: "newTab"
            widget: "boolean"
            default: false
            hint: "Leave off for pages on this site. Turn on for somewhere else entirely."

  columns: &columns
    label: "Columns"
    name: columns
    summary: "Columns"
    fields:
      - label: "Width"
        name: "layout"
        widget: "select"
        default: "equal"
        options: ["equal", "wide-left", "wide-right"]
        hint: "Columns stack into one on a phone whichever you choose."
      - label: "Columns"
        name: "columns"
        widget: "list"
        label_singular: "Column"
        fields:
          - label: "Body"
            name: "body"
            widget: "markdown"

  image: &image
    label: "Image"
    name: image
    summary: "Image: {{fields.alt}}"
    fields:
      - label: "Picture"
        name: "src"
        widget: "image"
      - label: "Describe this picture"
        name: "alt"
        widget: "string"
        required: false
        hint: "What would you say to someone on the phone who cannot see it? A person’s name, what is happening, what the graphic says."
      - label: "This picture is decorative"
        name: "decorative"
        widget: "boolean"
        default: false
        hint: "Tick only if the picture adds nothing a reader would miss. It will be hidden from screen readers. Leave unticked and write a description for every photograph of a person."
      - label: "Caption"
        name: "caption"
        widget: "string"
        required: false
      - label: "Width"
        name: "width"
        widget: "number"
        required: false
      - label: "Height"
        name: "height"
        widget: "number"
        required: false

  quote: &quote
    label: "Pull quote"
    name: quote
    summary: "Quote: {{fields.text}}"
    fields:
      - label: "Quote"
        name: "text"
        widget: "text"
      - label: "Attribution"
        name: "attribution"
        widget: "string"
        required: false

  form: &form
    label: "Form"
    name: form
    summary: "Form: {{fields.name}}"
    fields:
      - label: "Form name"
        name: "name"
        widget: "string"
        hint: "Shown with each message so you know which form it came from."
      - label: "Intro"
        name: "intro"
        widget: "text"
        required: false
      - label: "Questions"
        name: "fields"
        widget: "list"
        label_singular: "Question"
        summary: "{{fields.label}}"
        fields:
          - label: "Label"
            name: "label"
            widget: "string"
          - label: "Field name"
            name: "name"
            widget: "string"
            hint: "Lowercase, no spaces. This is the heading it arrives under."
          - label: "Type"
            name: "type"
            widget: "select"
            default: "text"
            options: ["text", "email", "tel", "textarea"]
          - label: "Required"
            name: "required"
            widget: "boolean"
            default: false
          - label: "Help text"
            name: "help"
            widget: "string"
            required: false
      - label: "Consent line"
        name: "consent"
        widget: "string"
        required: false
        hint: "A tick box people must agree to before sending. Leave empty for none."
      - label: "Thank-you message"
        name: "success"
        widget: "string"
        required: false
        hint: "Shown in place of the form once it has sent."
      - label: "Button text"
        name: "submit"
        widget: "string"
        default: "Send"
      - label: "Send submissions to"
        name: "action"
        widget: "string"
        required: false
        default: "netlify"
        hint: "Leave as netlify unless you have your own endpoint."

  html: &html
    label: "Custom HTML"
    name: html
    summary: "Custom HTML"
    fields:
      - label: "HTML"
        name: "html"
        widget: "code"
        default_language: "html"
        output_code_only: true
        hint: "An escape hatch. Anything here is published exactly as written."

collections:
  - name: pages
    label: "Pages"
    label_singular: "Page"
    folder: content/pages
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [title, date]
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "URL", name: url, widget: string, hint: "The address of this page, e.g. /about-us/our-team/" }
      - { label: "Date", name: date, widget: datetime }
      - { label: "Last updated", name: modified, widget: datetime, required: false }
      - { label: "Parent page", name: parent, widget: string, required: false,
          hint: "The slug of the page this sits under. Leave empty for a top-level page." }
      - { label: "Order", name: order, widget: number, required: false }
      # Declared because these editors write back only the fields they know
      # about. An undeclared key is not preserved, it is dropped — so the
      # 41 pages carrying a hand-written summary would lose it the first
      # time anyone opened them and pressed save.
      - { label: "Summary", name: excerpt, widget: text, required: false,
          hint: "Shown under the heading and in search results. Leave empty to use the opening of the page." }
      - { label: "Banner image", name: image, widget: image, required: false }
      - { label: "Banner alt text", name: imageAlt, widget: string, required: false }
      - label: "Sections"
        name: sections
        widget: list
        label_singular: "Section"
        types:
          - *prose
          - *disclosure
          - *embed
          - *card
          - *gallery
          - *profiles
          - *video
          - *buttons
          - *columns
          - *image
          - *quote
          - *form
          - *html

  - name: posts
    label: "News and blog"
    label_singular: "Post"
    folder: content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [date, title]
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "URL", name: url, widget: string }
      - { label: "Date", name: date, widget: datetime }
      - { label: "Last updated", name: modified, widget: datetime, required: false }
      - { label: "Categories", name: categories, widget: list, required: false,
          field: { label: Category, name: category, widget: string } }
      # Declared because these editors write back only the fields they know
      # about. An undeclared key is not preserved, it is dropped — so the
      # 41 pages carrying a hand-written summary would lose it the first
      # time anyone opened them and pressed save.
      - { label: "Summary", name: excerpt, widget: text, required: false,
          hint: "Shown under the heading and in search results. Leave empty to use the opening of the page." }
      - { label: "Featured image", name: image, widget: image, required: false }
      - { label: "Featured image alt text", name: imageAlt, widget: string, required: false }
      - label: "Sections"
        name: sections
        widget: list
        label_singular: "Section"
        types:
          - *prose
          - *disclosure
          - *embed
          - *card
          - *gallery
          - *profiles
          - *video
          - *buttons
          - *columns
          - *image
          - *quote
          - *form
          - *html
